# ==========================================
# RENDER BLUEPRINT (INFRASTRUCTURE AS CODE)
# Sistema Psico (Lumina) - Monorepo
# Provisiona Banco PostgreSQL + Web Service Docker (API) + Static Site (Front-end)
# ==========================================
databases:
  - name: lumina-postgres
    databaseName: lumina
    user: lumina_user
    region: oregon
    plan: free
    ipAllowList: [] # Permite conexões internas seguras

services:
  # 1. BACK-END LARAVEL (CONTAINER DOCKER)
  - type: web
    name: sistema-psico-api
    runtime: docker
    rootDir: sistema-psico
    dockerfilePath: Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: lumina-postgres
          property: connectionString
      - key: APP_NAME
        value: Lumina
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:U/rxrOujiTAWuEt4RtYD4Dwjx7NyRfWfLp4zyXJyzRc=
      - key: RUN_SEEDER
        value: "true"

  # 2. FRONT-END REACT (STATIC SITE)
  - type: web
    name: lumina-portal
    runtime: static
    rootDir: Portifolio-YasV2
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sistema-psico-api.onrender.com/api
